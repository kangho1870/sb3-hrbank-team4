server:
  port: ${PORT:8080}  # Railway는 PORT를 자동 할당하므로 반드시 환경변수 사용

logging:
  level:
    root: INFO
    org.hibernate.sql: debug
    org.hibernate.jdbc.bind: trace

spring:
  profiles:
    active: prod

  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET SESSION hibernate.jdbc.lob.non_contextual_creation=true

  devtools:
    restart:
      enabled: false

  jpa:
    generate-ddl: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
    open-in-view: false

hrbank:
  storage:
    type: local
    local:
      root-path: .hrbank/storage
  repository:
    file-directory: .hrbank
  batch:
    enabled: true
    time: "3600000"
